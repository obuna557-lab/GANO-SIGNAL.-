name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: |
          for z in *.zip; do unzip -o -q "$z"; done
          S=$(find . -name 'settings.gradle*' | head -1)
          echo "Loyiha: $S"
          [ -n "$S" ] || { echo "settings.gradle topilmadi"; ls -R | head -50; exit 1; }
          cd "$(dirname "$S")"
          ok=0
          for n in 1 2 3; do
            if gradle assembleRelease --no-daemon; then ok=1; break; fi
            sleep 60
          done
          [ $ok = 1 ]
      - uses: actions/upload-artifact@v4
        with:
          name: Gano-Signal-APK
          path: '**/app-release.apk'
